security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    role_hierarchy:
        # ROLE_EMPLOYEE: ROLE_USER

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        main:
            lazy: true
            provider: app_user_provider

            entry_point: form_login

            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: /
                always_use_default_target_path: true

            logout:
                path: app_logout
                target: app_login

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 604800
                path: /

    access_control:
        - { path: ^/admin, roles: ROLE_EMPLOYEE }
        - { path: ^/reserve, roles: ROLE_USER }
        - { path: ^/panier, roles: ROLE_USER }
        - { path: ^/reservation, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            App\Entity\User:
                algorithm: auto